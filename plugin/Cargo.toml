[package]
name = "particula_plugin"
version = "0.1.0"
edition = "2024"
description = "Particula Cloud — CLAP plugin + standalone host (via i_am_plugin / i_am_dsp_iced)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
particula = { path = ".." }
i_am_dsp = { path = "../../i_am_dsp/i_am_dsp" }
i_am_dsp_iced = { path = "../../i_am_dsp/i_am_dsp_iced" }
i_am_plugin = { path = "../../i_am_dsp/i_am_plugin" }
iced = { version = "0.14.0", features = ["canvas", "advanced"] }
crossbeam-channel = "0.5.16"

[dev-dependencies]
clack-host = { path = "../../clack/host" }